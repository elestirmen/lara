# Dedicated virtual hosts, loaded by the existing Nginx Proxy Manager.
server {
  listen 80;
  listen [::]:80;
  server_name lara.perinet.org;
  access_log off;
  more_set_headers "X-Robots-Tag: index, follow";
  include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
  return 301 https://lara.perinet.org$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name lara.perinet.org;
  more_set_headers "X-Robots-Tag: index, follow";
  ssl_certificate /etc/letsencrypt/live/npm-116/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-116/privkey.pem;
  include /etc/nginx/conf.d/include/ssl-ciphers.conf;
  access_log off;
  error_log /data/logs/lara-dersleri-error.log warn;
  client_max_body_size 1m;
  location / {
    set $lara_upstream lara-dersleri;
    resolver 127.0.0.11 valid=30s;
    proxy_pass http://$lara_upstream:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

