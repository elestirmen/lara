services:
  lara-dersleri:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: laranin-dersleri:1.0.0
    container_name: lara-dersleri
    restart: unless-stopped
    ports:
      - "127.0.0.1:18742:8080"
    networks:
      - npm-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 128m
    cpus: 1
networks:
  npm-net:
    external: true
