name: lara

services:
  lara-dersleri:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: laranin-dersleri:1.0.0
    container_name: lara-dersleri
    restart: unless-stopped
    ports:
      - "127.0.0.1:18742:8080"
    networks:
      - npm-net
      - lara-ic
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 128m
    cpus: 1
  # Seslendirme servisi: Piper (açık kaynak sinirsel ses). Port açmaz ve yalnız iç ağdadır (internete çıkamaz); lara-dersleri nginx'i /ses adresinden yönlendirir.
  lara-ses:
    build:
      context: .
      dockerfile: tts/Dockerfile
    image: laranin-sesi:1.0.0
    container_name: lara-ses
    restart: unless-stopped
    networks:
      - lara-ic
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - lara-ses-cache:/cache
    mem_limit: 800m
    cpus: 2
networks:
  npm-net:
    external: true
  lara-ic:
    internal: true
volumes:
  lara-ses-cache:
